        <h1>Strawberry Applesauce Recipe</h1>
        <a href="../index.html">Home</a>
        <img src="../images/Strawberry-Applesauce-Homemade.jpg" alt="Strawberry Applesauce" height="310" width="310">
        <h2>Description</h2>
        <p>Spruce up applesauce with the addition of strawberry jello.</p>
        <h2>Ingredients</h2>
        <ul>
            <li>1 package (4 serving size) JELL-O Brand Strawberry Flavor Gelatin</li>
            <li>2 cups applesauce</li>
        </ul>
        <h2>Steps</h2>
        <ol>
            <li>Stir dry gelatin mix into applesauce. Refrigerate until ready to serve.</li>
        </ol>
